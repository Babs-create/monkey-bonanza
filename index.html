<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Monkey Bonanza</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d2418; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    font-family: "Trebuchet MS", Verdana, sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; --s: 1; }
  canvas { display: block; border-radius: 6px; box-shadow: 0 8px 40px rgba(0,0,0,.55); touch-action: none; }
  #touch { position: absolute; inset: 0; pointer-events: none; display: none; }
  body.touch #touch { display: block; }
  .tb { position: absolute; pointer-events: auto; border: 0; border-radius: 50%; padding: 0;
    background: rgba(255,255,255,.2); color: #fff; font-weight: bold; touch-action: none;
    font-size: calc(var(--s) * 24px); width: calc(var(--s) * 64px); height: calc(var(--s) * 64px);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); -webkit-tap-highlight-color: transparent; }
  .tb.on { background: rgba(255,225,74,.55); }
  .tb.big { width: calc(var(--s) * 92px); height: calc(var(--s) * 92px); font-size: calc(var(--s) * 17px); }
  #b-left  { left: calc(var(--s) * 14px);  bottom: calc(var(--s) * 14px); }
  #b-right { left: calc(var(--s) * 86px);  bottom: calc(var(--s) * 14px); }
  #b-up    { left: calc(var(--s) * 164px); bottom: calc(var(--s) * 76px); }
  #b-down  { left: calc(var(--s) * 164px); bottom: calc(var(--s) * 8px); }
  #b-grab  { right: calc(var(--s) * 14px); bottom: calc(var(--s) * 14px); }
  #b-slap  { right: calc(var(--s) * 116px); bottom: calc(var(--s) * 14px); font-size: calc(var(--s) * 14px); }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="touch">
      <button class="tb" id="b-left" data-k="left">&#9664;</button>
      <button class="tb" id="b-right" data-k="right">&#9654;</button>
      <button class="tb" id="b-up" data-k="up">&#9650;</button>
      <button class="tb" id="b-down" data-k="down">&#9660;</button>
      <button class="tb" id="b-slap" data-k="slap">SLAP</button>
      <button class="tb big" id="b-grab" data-k="grab">JUMP<br>GRAB</button>
    </div>
  </div>
</div>
<script>
(() => {
'use strict';

// ---------------------------------------------------------------
// Constants and helpers
// ---------------------------------------------------------------
const W = 960, H = 540, GROUND_Y = 470, FEET = 26;
const G = 1900;          // gravity for free movement
const GS = 2100;         // gravity used by the vine pendulum
const RUN = 270, JUMP = 830;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');

let scale = 1, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  const cw = Math.max(1, Math.floor(W * scale)), ch = Math.max(1, Math.floor(H * scale));
  stage.style.width = cw + 'px';
  stage.style.height = ch + 'px';
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  canvas.width = Math.floor(cw * dpr);
  canvas.height = Math.floor(ch * dpr);
  stage.style.setProperty('--s', scale.toFixed(3));
}
window.addEventListener('resize', resize);
resize();

if ((window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window)) {
  document.body.classList.add('touch');
}

// ---------------------------------------------------------------
// Audio (tiny synth, starts on first input)
// ---------------------------------------------------------------
let actx = null, muted = false;
function ensureAudio() {
  if (!actx) {
    try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); } catch (e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') { try { actx.resume(); } catch (e) {} }
}
function tone(f, d, type, vol, slide, delay) {
  if (muted || !actx) return;
  try {
    const t = actx.currentTime + (delay || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
    g.gain.setValueAtTime(vol || 0.06, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + d + 0.03);
  } catch (e) {}
}
const sfx = {
  jump() { tone(320, .16, 'square', .035, 380); },
  grab() { tone(220, .09, 'triangle', .07, 160); },
  letgo() { tone(520, .14, 'sine', .04, -240); },
  banana(c) { tone(740 + c * 90, .1, 'triangle', .06); tone(1110 + c * 130, .12, 'triangle', .05, 0, .06); },
  coconut() { tone(170, .14, 'square', .06, -70); },
  thunk() { tone(110, .1, 'sine', .08, -40); },
  smash() { tone(140, .22, 'sawtooth', .06, -90); },
  snake() { tone(480, .08, 'square', .05, 300); tone(720, .16, 'square', .05, 300, .08); },
  hurt() { tone(260, .35, 'sawtooth', .07, -180); },
  splash() { tone(300, .35, 'sine', .06, -220); },
  slap() { tone(380, .08, 'sawtooth', .03, -200); },
  land() { tone(130, .07, 'sine', .04, -30); },
  bonanza() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, 'triangle', .06, 0, i * .09)); },
  over() { [392, 330, 262, 196].forEach((f, i) => tone(f, .28, 'triangle', .07, 0, i * .18)); }
};

// ---------------------------------------------------------------
// Game state
// ---------------------------------------------------------------
let mode = 'title';           // title, playing, paused, over
let T = 0, playT = 0, overT = 0, cullT = 0;
let grounds = [], waters = [], vines = [], trees = [], coconuts = [], snakes = [], nanas = [], parts = [], pops = [];
let groundEnd = 0, vineNext = 0, lastVine = null;
let m = null;
let camX = 0, maxX = 0, score = 0, nanaCount = 0, combo = 1, comboT = 0, kills = 0, knocked = 0;
let banner = { text: '', t: 0, color: '#fff' };
let best = 0, newBest = false;
try { best = parseInt(localStorage.getItem('monkeyBonanzaBest') || '0', 10) || 0; } catch (e) {}

const inp = { left: false, right: false, up: false, down: false, grab: false, jumpPress: false, slapPress: false };

const diff = () => clamp((maxX - 220) / 9000, 0, 1);
const totalScore = () => score + Math.floor(Math.max(0, maxX - 220) / 25);

// ---------------------------------------------------------------
// World generation
// ---------------------------------------------------------------
function addNana(x, y, gold) { nanas.push({ x, y, got: false, gold: !!gold }); }

function addTree(x) {
  const h = rand(175, 215), lean = rand(-30, 30);
  const tr = { x, h, lean, cx: x + lean, cy: GROUND_Y - h, sway: rand(0, 6) };
  trees.push(tr);
  const n = Math.random() < 0.5 ? 3 : 2;
  for (let i = 0; i < n; i++) {
    coconuts.push({
      x: tr.cx + (i - (n - 1) / 2) * 20, y: tr.cy + 19 + (i % 2) * 5,
      vx: 0, vy: 0, state: 0, bounces: 0, r: 11, rot: rand(0, TAU), spin: 0, dead: false
    });
  }
}

function addSnake(x, minX, maxX) {
  const d = diff();
  snakes.push({ x, min: minX, max: maxX, dir: Math.random() < 0.5 ? -1 : 1, speed: rand(45, 60) + 40 * d,
    alive: true, dead: 0, seed: rand(0, 6) });
}

function decorate(x0, x1, first) {
  let x = x0 + rand(120, 200);
  while (x < x1 - 140) {
    addTree(x);
    const chance = (first && x < 1150) ? 0 : 0.4 + 0.35 * diff();
    if (Math.random() < chance) addSnake(x + rand(-40, 40), Math.max(x0 + 30, x - 130), Math.min(x1 - 30, x + 130));
    if (Math.random() < 0.7) {
      const bx = x + rand(120, 170);
      if (bx < x1 - 100) for (let i = 0; i < 4; i++) addNana(bx + i * 34, GROUND_Y - 46 - (i % 2 ? 6 : 0));
    }
    x += rand(330, 460);
  }
}

function addVine(x) {
  const v = { ax: x, ay: 28, L: rand(250, 330), th: rand(-0.3, 0.3), om: 0, phase: rand(0, TAU),
    amp: rand(0.3, 0.45), w: rand(2.0, 2.6), blend: 1, sim: 0, simOm: 0, held: false, cd: 0 };
  vines.push(v);
  return v;
}

function addArc(a, b) {
  const x0 = a.ax + 80, x1 = b.ax - 60;
  if (x1 - x0 < 80) return;
  const base = rand(215, 285), n = 5;
  const goldIdx = Math.random() < 0.08 ? Math.floor(rand(0, n)) : -1;
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    addNana(lerp(x0, x1, t), base - 55 * Math.sin(Math.PI * t), i === goldIdx);
  }
}

function addChunk() {
  const d = diff();
  const gap = rand(110, 170 + 90 * d);
  const len = rand(560, 1000);
  const x0 = groundEnd + gap, x1 = x0 + len;
  waters.push({ x0: groundEnd, x1: x0, seed: rand(0, 10) });
  grounds.push({ x0, x1 });
  // make sure a vine sits near every gap
  const mid = groundEnd + gap / 2;
  let near = Infinity;
  for (const v of vines) near = Math.min(near, Math.abs(v.ax - mid));
  if (near > 150) addVine(mid + rand(-30, 30));
  decorate(x0, x1, false);
  groundEnd = x1;
}

function generate(limit) {
  while (vineNext < limit) {
    const v = addVine(vineNext);
    if (lastVine) addArc(lastVine, v);
    lastVine = v;
    vineNext += rand(330, 380 + 60 * diff());
  }
  while (groundEnd < limit) addChunk();
}

function cull() {
  const lim = camX - 1600;
  vines = vines.filter(v => v.ax > lim || v.held);
  trees = trees.filter(t => t.x > lim);
  coconuts = coconuts.filter(c => c.x > lim && !c.dead);
  snakes = snakes.filter(s => s.x > lim && (s.alive || s.dead > 0));
  nanas = nanas.filter(b => b.x > lim && !b.got);
  grounds = grounds.filter(g => g.x1 > lim);
  waters = waters.filter(w => w.x1 > lim);
}

function newGame() {
  grounds = []; waters = []; vines = []; trees = []; coconuts = []; snakes = []; nanas = []; parts = []; pops = [];
  grounds.push({ x0: -600, x1: 1500 });
  groundEnd = 1500;
  vineNext = 600; lastVine = null;
  camX = 0; maxX = 220; score = 0; nanaCount = 0; combo = 1; comboT = 0; kills = 0; knocked = 0;
  banner = { text: '', t: 0, color: '#fff' };
  newBest = false;
  m = { x: 220, y: GROUND_Y - FEET, vx: 0, vy: 0, onGround: true, vine: null, r: 0, face: 1, hearts: 3, inv: 0,
    coyote: 0.1, jumpBuf: 0, slap: 0, slapCd: 0, anim: 0, noGrab: 0 };
  decorate(640, 1480, true);
  generate(camX + W + 1600);
}

// ---------------------------------------------------------------
// Effects
// ---------------------------------------------------------------
function burst(x, y, n, color, spd, life, size, grav) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(spd * 0.3, spd);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - spd * 0.3, life, max: life, color,
      size: rand(size * 0.5, size), g: grav });
  }
}
function pop(x, y, text, color) { pops.push({ x, y, text, color: color || '#fff', life: 1.1 }); }
function showBanner(text, color) { banner = { text, t: 2.2, color: color || '#fff' }; }

// ---------------------------------------------------------------
// Monkey logic
// ---------------------------------------------------------------
function groundAt(x) {
  for (const g of grounds) if (x >= g.x0 - 6 && x <= g.x1 + 6) return true;
  return false;
}

function vineProbe(v) {
  const dx = Math.sin(v.th) * v.L, dy = Math.cos(v.th) * v.L;
  const t = clamp(((m.x - v.ax) * dx + (m.y - v.ay) * dy) / (v.L * v.L), 0, 1);
  const px = v.ax + dx * t, py = v.ay + dy * t;
  return { d: Math.hypot(m.x - px, m.y - py), px, py, t };
}

function tryGrab() {
  let best = null, bd = 40;
  for (const v of vines) {
    if (v.held || v.cd > 0 || Math.abs(v.ax - m.x) > 380) continue;
    const p = vineProbe(v);
    if (p.t * v.L < 70) continue;
    if (p.d < bd) { bd = p.d; best = v; }
  }
  if (!best) return;
  const v = best;
  const dx = m.x - v.ax, dy = m.y - v.ay;
  const r = clamp(Math.hypot(dx, dy), 90, v.L);
  const th = Math.atan2(dx, dy);
  const tx = Math.cos(th), ty = -Math.sin(th);
  v.held = true;
  v.th = th;
  v.om = clamp((m.vx * tx + m.vy * ty) / r, -4.2, 4.2);
  m.vine = v; m.r = r; m.onGround = false;
  sfx.grab();
}

function letGo() {
  const v = m.vine;
  if (!v) return;
  const tx = Math.cos(v.th), ty = -Math.sin(v.th);
  let vx = v.om * m.r * tx * 1.05, vy = v.om * m.r * ty * 1.05 - 60;
  const sp = Math.hypot(vx, vy);
  if (sp > 1050) { vx *= 1050 / sp; vy *= 1050 / sp; }
  m.vx = vx; m.vy = vy;
  v.held = false; v.sim = v.th; v.simOm = v.om; v.blend = 0; v.cd = 0.3;
  m.vine = null; m.noGrab = 0.25; m.coyote = 0;
  sfx.letgo();
}

function hurt(dir) {
  if (m.inv > 0) return;
  if (m.vine) letGo();
  m.hearts--;
  m.inv = 1.8;
  sfx.hurt();
  burst(m.x, m.y, 10, '#ff6b5a', 220, 0.5, 4, 700);
  if (m.hearts <= 0) { gameOver(); return; }
  m.vx = (dir || -m.face) * 300; m.vy = -520; m.onGround = false; m.noGrab = 0.2;
}

function fallInWater() {
  burst(m.x, GROUND_Y + 14, 22, '#a8dcff', 320, 0.8, 5, 900);
  sfx.splash();
  if (m.vine) letGo();
  m.hearts--;
  if (m.hearts <= 0) { gameOver(); return; }
  let wbest = null, wd = Infinity;
  for (const w of waters) { const d = Math.abs((w.x0 + w.x1) / 2 - m.x); if (d < wd) { wd = d; wbest = w; } }
  const rx = wbest ? wbest.x0 - 50 : camX + 300;
  m.x = rx; m.y = GROUND_Y - FEET; m.vx = 0; m.vy = 0; m.onGround = true; m.inv = 2.2; m.noGrab = 0.2;
  camX = Math.max(0, rx - 330);
  showBanner('SPLASH! Mind the river', '#a8dcff');
}

function doSlap() {
  if (m.slapCd > 0 || mode !== 'playing') return;
  m.slap = 0.2; m.slapCd = 0.35;
  sfx.slap();
  for (const c of coconuts) {
    if (c.state === 0 && Math.hypot(c.x - m.x, c.y - m.y) < 95) knock(c, m.face);
  }
}

function knock(c, dir) {
  c.state = 1;
  c.vx = dir * rand(60, 140) + m.vx * 0.25;
  c.vy = -rand(200, 300);
  c.spin = rand(-8, 8);
  score += 20; knocked++;
  pop(c.x, c.y - 14, '+20', '#ffd9a0');
  burst(c.x, c.y, 6, '#3a9a46', 140, 0.5, 4, 500);
  sfx.coconut();
}

function bonanza() {
  score += 200;
  sfx.bonanza();
  if (m.hearts < 5) { m.hearts++; showBanner('BANANA BONANZA! +200 and +1 heart', '#ffe14a'); }
  else showBanner('BANANA BONANZA! +200', '#ffe14a');
}

function updateMonkey(dt) {
  m.anim += dt;
  if (m.inv > 0) m.inv -= dt;
  if (m.noGrab > 0) m.noGrab -= dt;
  if (m.slapCd > 0) m.slapCd -= dt;
  if (m.slap > 0) m.slap -= dt;
  if (m.jumpBuf > 0) m.jumpBuf -= dt;
  if (inp.jumpPress) { m.jumpBuf = 0.12; inp.jumpPress = false; }
  if (inp.slapPress) { inp.slapPress = false; doSlap(); }
  const ix = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  const iy = (inp.down ? 1 : 0) - (inp.up ? 1 : 0);

  if (m.vine) {
    const v = m.vine;
    if (iy) m.r = clamp(m.r + iy * 150 * dt, 90, v.L);
    v.om += ix * 5.2 * dt;
    v.om += -(GS / m.r) * Math.sin(v.th) * dt;
    v.om *= (1 - 0.1 * dt);
    v.om = clamp(v.om, -4.2, 4.2);
    v.th += v.om * dt;
    if (v.th > 1.45) { v.th = 1.45; if (v.om > 0) v.om = 0; }
    if (v.th < -1.45) { v.th = -1.45; if (v.om < 0) v.om = 0; }
    m.x = v.ax + Math.sin(v.th) * m.r;
    m.y = v.ay + Math.cos(v.th) * m.r;
    m.vx = v.om * m.r * Math.cos(v.th);
    m.vy = -v.om * m.r * Math.sin(v.th);
    if (Math.abs(v.om) > 0.25) m.face = v.om > 0 ? 1 : -1;
    if (!inp.grab) letGo();
    return;
  }

  // free movement
  if (m.onGround) m.coyote = 0.1; else m.coyote -= dt;
  if (m.onGround) {
    const target = ix * RUN, a = 3200 * dt;
    if (m.vx < target) m.vx = Math.min(target, m.vx + a);
    else if (m.vx > target) m.vx = Math.max(target, m.vx - a);
  } else {
    if (ix && (Math.abs(m.vx) < 320 || Math.sign(m.vx) !== ix)) m.vx += ix * 1000 * dt;
    m.vx *= (1 - 0.12 * dt);
  }
  if (ix) m.face = ix; else if (Math.abs(m.vx) > 30) m.face = m.vx > 0 ? 1 : -1;

  if (m.jumpBuf > 0 && (m.onGround || m.coyote > 0)) {
    m.vy = -JUMP; m.onGround = false; m.coyote = 0; m.jumpBuf = 0;
    sfx.jump();
    burst(m.x, GROUND_Y, 5, '#c9b98a', 120, 0.35, 3, 300);
  }
  m.vy = Math.min(m.vy + G * dt, 1500);
  m.x += m.vx * dt;
  m.y += m.vy * dt;

  const feet = m.y + FEET;
  const g = groundAt(m.x);
  if (g && feet >= GROUND_Y && m.vy >= 0 && feet - m.vy * dt <= GROUND_Y + 14) {
    m.y = GROUND_Y - FEET;
    if (!m.onGround) {
      if (m.vy > 500) { burst(m.x, GROUND_Y, 6, '#c9b98a', 140, 0.4, 3, 300); sfx.land(); }
      combo = 1; comboT = 0;
    }
    m.vy = 0; m.onGround = true;
  } else if (m.onGround && !g) {
    m.onGround = false;
  }

  if (m.y + FEET > GROUND_Y + 60) { fallInWater(); return; }
  if (m.y < 62) { m.y = 62; if (m.vy < 0) m.vy = 0; }
  if (m.x < camX + 16) { m.x = camX + 16; if (m.vx < 0) m.vx = 0; }

  if (inp.grab && !m.onGround && m.noGrab <= 0) tryGrab();
}

// ---------------------------------------------------------------
// World updates
// ---------------------------------------------------------------
function updateVines(dt) {
  for (const v of vines) {
    if (v.cd > 0) v.cd -= dt;
    if (v.held) continue;
    const idle = v.amp * Math.sin(v.w * T + v.phase);
    if (v.blend < 1) {
      v.simOm += -(GS / v.L) * Math.sin(v.sim) * dt;
      v.simOm *= (1 - 1.2 * dt);
      v.sim += v.simOm * dt;
      v.blend = Math.min(1, v.blend + dt / 1.6);
      const b = v.blend * v.blend * (3 - 2 * v.blend);
      v.th = lerp(v.sim, idle, b);
    } else {
      v.th = idle;
    }
  }
}

function smashCoconut(c) {
  c.dead = true;
  burst(c.x, c.y, 10, '#6b4a2a', 220, 0.6, 4, 800);
  burst(c.x, c.y, 6, '#f4efe0', 180, 0.5, 3, 800);
  sfx.smash();
}

function updateCoconuts(dt) {
  for (const c of coconuts) {
    if (c.dead) continue;
    if (c.state === 0) {
      if (Math.abs(c.x - m.x) < 70 && Math.hypot(c.x - m.x, c.y - m.y) < 34) {
        knock(c, m.vx > 40 ? 1 : (m.vx < -40 ? -1 : m.face));
      }
      continue;
    }
    c.vy += G * dt;
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.rot += c.spin * dt;
    for (const sn of snakes) {
      if (sn.alive && Math.abs(c.x - sn.x) < 36 && c.y + c.r > GROUND_Y - 38 && c.y - c.r < GROUND_Y) {
        killSnake(sn);
        smashCoconut(c);
        break;
      }
    }
    if (c.dead) continue;
    if (c.y + c.r >= GROUND_Y && c.vy > 0) {
      if (groundAt(c.x)) {
        c.y = GROUND_Y - c.r;
        if (c.bounces === 0 && c.vy > 300) { c.vy = -c.vy * 0.38; c.vx *= 0.6; c.bounces = 1; sfx.thunk(); }
        else smashCoconut(c);
      } else if (c.y > GROUND_Y + 28) {
        burst(c.x, GROUND_Y + 16, 8, '#a8dcff', 200, 0.6, 4, 900);
        c.dead = true;
      }
    }
  }
  coconuts = coconuts.filter(c => !c.dead);
}

function killSnake(sn) {
  sn.alive = false; sn.dead = 0.7;
  kills++; score += 250;
  pop(sn.x, GROUND_Y - 50, '+250', '#9dff7a');
  showBanner('COCONUT STRIKE! Golden banana dropped', '#9dff7a');
  burst(sn.x, GROUND_Y - 12, 14, '#6fbf3a', 260, 0.7, 5, 700);
  addNana(sn.x, GROUND_Y - 44, true);
  sfx.snake();
}

function updateSnakes(dt) {
  for (const sn of snakes) {
    if (!sn.alive) { sn.dead -= dt; continue; }
    sn.x += sn.dir * sn.speed * dt;
    if (sn.x < sn.min) { sn.x = sn.min; sn.dir = 1; }
    if (sn.x > sn.max) { sn.x = sn.max; sn.dir = -1; }
    if (m.inv <= 0 && !m.vine && Math.abs(m.x - sn.x) < 34 && m.y + FEET > GROUND_Y - 22) {
      hurt(m.x < sn.x ? -1 : 1);
      if (mode !== 'playing') return;
    }
  }
  snakes = snakes.filter(s => s.alive || s.dead > 0);
}

function collectNanas() {
  for (const b of nanas) {
    if (b.got || Math.abs(b.x - m.x) > 40) continue;
    if (Math.hypot(b.x - m.x, b.y - m.y) > 34) continue;
    b.got = true; nanaCount++;
    let mult = 1;
    if (!m.onGround) {
      combo = comboT > 0 ? Math.min(5, combo + 1) : 1;
      comboT = 1.6; mult = combo;
    } else { combo = 1; comboT = 0; }
    const pts = (b.gold ? 50 : 10) * mult;
    score += pts;
    pop(b.x, b.y - 12, '+' + pts, b.gold ? '#fff27a' : '#ffffff');
    burst(b.x, b.y, b.gold ? 12 : 6, '#ffe14a', 150, 0.45, 3, 200);
    sfx.banana(mult);
    if (nanaCount % 20 === 0) bonanza();
  }
}

function updateCamera(dt) {
  const lead = clamp(m.vx * 0.22, -60, 220);
  const target = m.x - 330 + lead;
  const nc = camX + (target - camX) * Math.min(1, 5 * dt);
  if (nc > camX) camX = nc;
  if (m.x > maxX) maxX = m.x;
}

function updateEffects(dt) {
  for (const p of parts) {
    p.life -= dt;
    p.vy += p.g * dt;
    p.vx *= (1 - 1.5 * dt);
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  parts = parts.filter(p => p.life > 0);
  for (const p of pops) { p.life -= dt; p.y -= 38 * dt; }
  pops = pops.filter(p => p.life > 0);
  if (banner.t > 0) banner.t -= dt;
}

function update(dt) {
  T += dt; playT += dt;
  updateVines(dt);
  updateMonkey(dt);
  if (mode !== 'playing') return;
  updateCoconuts(dt);
  updateSnakes(dt);
  if (mode !== 'playing') return;
  collectNanas();
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 1; }
  updateCamera(dt);
  generate(camX + W + 1600);
  cullT += dt;
  if (cullT > 1) { cullT = 0; cull(); }
  updateEffects(dt);
}

function ambient(dt) {
  T += dt;
  updateVines(dt);
  if (m) m.anim += dt;
  updateEffects(dt);
  if (mode === 'over') overT += dt;
}

function startGame() {
  if (mode === 'over' && overT < 0.7) return;
  newGame();
  mode = 'playing';
  playT = 0;
}

function gameOver() {
  mode = 'over'; overT = 0;
  const total = totalScore();
  if (total > best) {
    best = total; newBest = true;
    try { localStorage.setItem('monkeyBonanzaBest', String(best)); } catch (e) {}
  }
  inp.grab = false;
  sfx.over();
}

// ---------------------------------------------------------------
// Drawing helpers
// ---------------------------------------------------------------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function txt(str, x, y, size, color, align, stroke) {
  ctx.font = 'bold ' + size + 'px "Trebuchet MS", Verdana, sans-serif';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(3, size / 5);
  ctx.strokeStyle = stroke || 'rgba(20,10,0,.65)';
  ctx.strokeText(str, x, y);
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}

function limb(x1, y1, x2, y2, w, col) {
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

function drawHeart(x, y, s, full) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath();
  ctx.moveTo(0, 0.32);
  ctx.bezierCurveTo(-0.1, 0.05, -0.5, -0.05, -0.5, -0.3);
  ctx.bezierCurveTo(-0.5, -0.55, -0.1, -0.6, 0, -0.35);
  ctx.bezierCurveTo(0.1, -0.6, 0.5, -0.55, 0.5, -0.3);
  ctx.bezierCurveTo(0.5, -0.05, 0.1, 0.05, 0, 0.32);
  ctx.closePath();
  ctx.fillStyle = full ? '#ff4d5e' : 'rgba(0,0,0,.35)';
  ctx.fill();
  ctx.lineWidth = 0.07; ctx.strokeStyle = full ? '#7a1020' : 'rgba(255,255,255,.4)'; ctx.stroke();
  if (full) { ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(-0.25, -0.3, 0.1, 0.06, -0.6, 0, TAU); ctx.fill(); }
  ctx.restore();
}

function drawBanana(x, y, gold) {
  ctx.save();
  ctx.translate(x, y + Math.sin(T * 3 + x * 0.05) * 3);
  ctx.rotate(-0.6);
  if (gold) { ctx.shadowColor = '#fff3a0'; ctx.shadowBlur = 16; }
  ctx.lineCap = 'round';
  ctx.strokeStyle = gold ? '#ffcf1a' : '#ffe14a';
  ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(-13, -4); ctx.quadraticCurveTo(0, 14, 14, -6); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = gold ? '#e6a800' : '#e6b800';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-11, 0); ctx.quadraticCurveTo(0, 16, 12, -3); ctx.stroke();
  ctx.fillStyle = '#6b4a1f';
  ctx.beginPath(); ctx.arc(-14, -5, 2.6, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(15, -7, 2.6, 0, TAU); ctx.fill();
  if (gold) {
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    const s = 2 + Math.sin(T * 8 + x) * 1.2;
    ctx.fillRect(-2, -14 - s, 1.6, s * 2); ctx.fillRect(-2 - s + 0.8, -14, s * 2, 1.6);
  }
  ctx.restore();
}

function drawCoconut(c) {
  ctx.save();
  ctx.translate(c.x, c.y); ctx.rotate(c.rot || 0);
  ctx.fillStyle = '#5b3a1e'; ctx.beginPath(); ctx.arc(0, 0, c.r, 0, TAU); ctx.fill();
  ctx.fillStyle = '#7d5430'; ctx.beginPath(); ctx.arc(-3, -3, c.r * 0.55, 0, TAU); ctx.fill();
  ctx.fillStyle = '#2b190a';
  ctx.beginPath(); ctx.arc(-3, 3, 1.8, 0, TAU); ctx.arc(3, 3, 1.8, 0, TAU); ctx.arc(0, 7, 1.8, 0, TAU); ctx.fill();
  ctx.restore();
}

// ---------------------------------------------------------------
// Background and world drawing
// ---------------------------------------------------------------
function mountains(f, base, amp, color, freq, seed) {
  const off = camX * f;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W + 12; x += 12) {
    const wx = x + off;
    const y = base - amp * (0.55 + 0.3 * Math.sin(wx * freq + seed) + 0.15 * Math.sin(wx * freq * 2.7 + seed * 3));
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}

function silhouettes(f, spacing, color, seed, minH, maxH) {
  const off = camX * f;
  const first = Math.floor(off / spacing) - 1, last = Math.ceil((off + W) / spacing) + 1;
  ctx.fillStyle = color;
  for (let i = first; i <= last; i++) {
    const r1 = hash(i * 3.1 + seed), r2 = hash(i * 7.7 + seed), r3 = hash(i * 5.3 + seed);
    const x = i * spacing + r1 * spacing * 0.6 - off;
    const h = minH + r2 * (maxH - minH);
    const base = GROUND_Y + 10, top = base - h, cr = 36 + r3 * 28;
    ctx.fillRect(x - 5, top, 10, h);
    ctx.beginPath();
    ctx.arc(x, top, cr, 0, TAU);
    ctx.arc(x - cr * 0.75, top + cr * 0.3, cr * 0.7, 0, TAU);
    ctx.arc(x + cr * 0.75, top + cr * 0.3, cr * 0.7, 0, TAU);
    ctx.fill();
  }
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  g.addColorStop(0, '#6fc7c4'); g.addColorStop(0.55, '#cfeab0'); g.addColorStop(1, '#f4efb0');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const sx = 740 - camX * 0.02;
  const rg = ctx.createRadialGradient(sx, 130, 10, sx, 130, 190);
  rg.addColorStop(0, 'rgba(255,250,200,.95)'); rg.addColorStop(0.3, 'rgba(255,245,170,.5)'); rg.addColorStop(1, 'rgba(255,245,170,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  mountains(0.06, 300, 70, 'rgba(96,170,150,.55)', 0.0035, 1);
  mountains(0.12, 350, 60, 'rgba(70,150,120,.7)', 0.005, 2);
  silhouettes(0.25, 190, '#4a9c6c', 11, 150, 260);
  silhouettes(0.45, 150, '#2f7d54', 23, 130, 250);
  const fog = ctx.createLinearGradient(0, GROUND_Y - 140, 0, GROUND_Y + 10);
  fog.addColorStop(0, 'rgba(235,250,210,0)'); fog.addColorStop(1, 'rgba(235,250,210,.32)');
  ctx.fillStyle = fog; ctx.fillRect(0, GROUND_Y - 140, W, 150);
}

function drawCanopy(front) {
  const start = Math.floor((camX - 100) / 50), end = Math.ceil((camX + W + 100) / 50);
  for (let i = start; i <= end; i++) {
    const r = hash(i * 1.7 + (front ? 50 : 0));
    const x = i * 50 + r * 20;
    const rad = front ? 22 + hash(i * 2.3) * 12 : 38 + hash(i * 2.3) * 18;
    const y = front ? hash(i * 3.9) * 8 : 14 + hash(i * 3.9) * 14;
    ctx.fillStyle = front ? '#2d7a3d' : '#1c5532';
    ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU); ctx.fill();
    if (!front && hash(i * 9.1) > 0.55) {
      ctx.beginPath();
      ctx.ellipse(x + 8, y + rad, 6, 16 + hash(i * 4.4) * 14, 0, 0, TAU);
      ctx.fill();
    }
  }
}

function drawGround() {
  for (const g of grounds) {
    if (g.x1 < camX - 60 || g.x0 > camX + W + 60) continue;
    const x0 = Math.max(g.x0, camX - 60), x1 = Math.min(g.x1, camX + W + 60);
    const sg = ctx.createLinearGradient(0, GROUND_Y, 0, H);
    sg.addColorStop(0, '#6b4526'); sg.addColorStop(1, '#2f1c0e');
    ctx.fillStyle = sg; ctx.fillRect(x0, GROUND_Y, x1 - x0, H - GROUND_Y);
    ctx.fillStyle = '#58b947'; ctx.fillRect(x0, GROUND_Y - 2, x1 - x0, 14);
    ctx.fillStyle = '#3f9a37'; ctx.fillRect(x0, GROUND_Y + 9, x1 - x0, 5);
    ctx.fillStyle = '#6dcb55';
    for (let x = Math.floor(x0 / 22) * 22; x < x1; x += 22) {
      const hh = 4 + hash(x * 0.37) * 7;
      ctx.beginPath(); ctx.moveTo(x, GROUND_Y - 2); ctx.lineTo(x + 5, GROUND_Y - 2 - hh); ctx.lineTo(x + 10, GROUND_Y - 2); ctx.fill();
    }
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    for (let x = Math.floor(x0 / 70) * 70; x < x1; x += 70) {
      const k = hash(x * 0.13);
      ctx.beginPath(); ctx.ellipse(x + k * 40, GROUND_Y + 34 + k * 40, 8 + k * 8, 5 + k * 3, 0, 0, TAU); ctx.fill();
    }
  }
}

function drawWater() {
  for (const w of waters) {
    if (w.x1 < camX - 20 || w.x0 > camX + W + 20) continue;
    const top = GROUND_Y + 18;
    const wg = ctx.createLinearGradient(0, top, 0, H);
    wg.addColorStop(0, '#3a97bd'); wg.addColorStop(1, '#0f4663');
    ctx.fillStyle = wg; ctx.fillRect(w.x0, top, w.x1 - w.x0, H - top);
    ctx.fillStyle = 'rgba(190,235,255,.55)';
    ctx.beginPath(); ctx.moveTo(w.x0, top + 8);
    for (let x = w.x0; x <= w.x1; x += 8) ctx.lineTo(x, top + Math.sin(x * 0.07 + T * 3) * 2.5);
    ctx.lineTo(w.x1, top + 8); ctx.closePath(); ctx.fill();
    if (w.x1 - w.x0 > 130) {
      const cx = (w.x0 + w.x1) / 2 + Math.sin(T * 0.7 + w.seed) * 25;
      const by = top + 2 + Math.sin(T * 2 + w.seed) * 2;
      ctx.fillStyle = 'rgba(30,80,40,.45)';
      ctx.beginPath(); ctx.ellipse(cx, by + 12, 34, 9, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#3b7d2e';
      ctx.beginPath(); ctx.ellipse(cx - 10, by, 8, 7, 0, 0, TAU); ctx.ellipse(cx + 10, by, 8, 7, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffe94a';
      ctx.beginPath(); ctx.arc(cx - 10, by - 1, 3.4, 0, TAU); ctx.arc(cx + 10, by - 1, 3.4, 0, TAU); ctx.fill();
      ctx.fillStyle = '#111';
      ctx.fillRect(cx - 10.8, by - 4, 1.6, 6); ctx.fillRect(cx + 9.2, by - 4, 1.6, 6);
    }
  }
}

function drawSign(x) {
  ctx.fillStyle = '#6b4423'; ctx.fillRect(x - 4, GROUND_Y - 74, 8, 76);
  ctx.save(); ctx.translate(x, GROUND_Y - 78);
  rr(-46, -26, 92, 38, 6); ctx.fillStyle = '#c8924f'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = '#6b4423'; ctx.stroke();
  txt('GO >>', 0, 0, 22, '#fff7d6', 'center', '#4a2a0a');
  ctx.restore();
}

function treePoint(tr, t) {
  const sgn = tr.lean >= 0 ? -1 : 1;
  const p0x = tr.x, p0y = GROUND_Y;
  const p1x = tr.x + tr.lean * 0.15 + sgn * 14, p1y = GROUND_Y - tr.h * 0.55;
  const u = 1 - t;
  return {
    x: u * u * p0x + 2 * u * t * p1x + t * t * tr.cx,
    y: u * u * p0y + 2 * u * t * p1y + t * t * tr.cy,
    cx: p1x, cy: p1y
  };
}

function drawTreeBack(tr) {
  const sgn = tr.lean >= 0 ? -1 : 1;
  const p1x = tr.x + tr.lean * 0.15 + sgn * 14, p1y = GROUND_Y - tr.h * 0.55;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#7c5231'; ctx.lineWidth = 20;
  ctx.beginPath(); ctx.moveTo(tr.x, GROUND_Y + 2); ctx.quadraticCurveTo(p1x, p1y, tr.cx, tr.cy); ctx.stroke();
  ctx.strokeStyle = '#a57346'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(tr.x - 4, GROUND_Y + 2); ctx.quadraticCurveTo(p1x - 4, p1y, tr.cx - 4, tr.cy); ctx.stroke();
  ctx.strokeStyle = 'rgba(50,25,5,.35)'; ctx.lineWidth = 2;
  for (let t = 0.08; t < 0.95; t += 0.1) {
    const p = treePoint(tr, t);
    ctx.beginPath(); ctx.moveTo(p.x - 9, p.y); ctx.quadraticCurveTo(p.x, p.y + 4, p.x + 9, p.y); ctx.stroke();
  }
}

function drawTreeFront(tr) {
  const n = 7;
  for (let i = 0; i < n; i++) {
    const a = -Math.PI + 0.15 + (i / (n - 1)) * (Math.PI - 0.3) + Math.sin(T * 1.5 + tr.sway + i) * 0.05;
    const len = 78 + (i % 2) * 10;
    const ex = tr.cx + Math.cos(a) * len, ey = tr.cy + Math.sin(a) * len * 0.7 + 26;
    const cpx = tr.cx + Math.cos(a) * len * 0.55, cpy = tr.cy + Math.sin(a) * len * 0.7 * 0.55 - 16;
    ctx.fillStyle = i % 2 ? '#2e8f3e' : '#3fae4a';
    ctx.beginPath();
    ctx.moveTo(tr.cx, tr.cy);
    ctx.quadraticCurveTo(cpx, cpy - 9, ex, ey);
    ctx.quadraticCurveTo(cpx, cpy + 9, tr.cx, tr.cy);
    ctx.fill();
  }
}

function drawVine(v) {
  const dx = Math.sin(v.th), dy = Math.cos(v.th);
  const tx = v.ax + dx * v.L, ty = v.ay + dy * v.L;
  let bend = 0;
  if (!v.held) bend = clamp(-v.simOm * (1 - v.blend) * 6, -10, 10);
  const mx = v.ax + dx * v.L * 0.5 + dy * bend, my = v.ay + dy * v.L * 0.5 - dx * bend;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#2b6126'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(v.ax, v.ay); ctx.quadraticCurveTo(mx, my, tx, ty); ctx.stroke();
  ctx.strokeStyle = '#58a845'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(v.ax - 1, v.ay); ctx.quadraticCurveTo(mx - 1, my, tx - 1, ty); ctx.stroke();
  ctx.fillStyle = '#3f8f35';
  for (let d = 60; d < v.L - 10; d += 58) {
    const px = v.ax + dx * d, py = v.ay + dy * d;
    ctx.beginPath(); ctx.ellipse(px + 8, py, 8, 3.4, 0.5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(px - 8, py + 8, 8, 3.4, -0.5, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#244f20'; ctx.beginPath(); ctx.arc(tx, ty, 5, 0, TAU); ctx.fill();
  // grab hint: glow where the monkey could grab
  if (m && mode === 'playing' && !m.vine && !m.onGround && v.cd <= 0) {
    const p = vineProbe(v);
    if (p.d < 90 && p.t * v.L >= 70) {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.18 + 0.25 * (1 - p.d / 90)) + ')';
      ctx.beginPath(); ctx.arc(p.px, p.py, 15, 0, TAU); ctx.fill();
    }
  }
}

function drawSnake(sn) {
  const dir = sn.dir;
  ctx.save();
  if (!sn.alive) ctx.globalAlpha = clamp(sn.dead / 0.7, 0, 1);
  const flat = sn.alive ? 1 : 0.35;
  for (let i = 12; i >= 0; i--) {
    const px = sn.x - dir * i * 5;
    const py = GROUND_Y - 8 * flat + Math.sin(T * 6 + i * 0.7 + sn.seed) * 3 * flat;
    const r = 5 + (12 - i) * 0.2;
    ctx.fillStyle = i % 3 === 0 ? '#3a7d1f' : '#6fbf3a';
    ctx.beginPath(); ctx.ellipse(px, py, r, r * flat + 1, 0, 0, TAU); ctx.fill();
  }
  const hx = sn.x + dir * 6, hy = GROUND_Y - 10 * flat;
  ctx.fillStyle = '#7fd04a';
  ctx.beginPath(); ctx.ellipse(hx, hy, 9, 7 * flat + 1, 0, 0, TAU); ctx.fill();
  if (sn.alive) {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(hx + dir * 3, hy - 3, 2.6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(hx + dir * 4, hy - 3, 1.2, 0, TAU); ctx.fill();
    if (Math.sin(T * 9 + sn.seed) > 0.2) {
      ctx.strokeStyle = '#e83a4a'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(hx + dir * 9, hy + 1); ctx.lineTo(hx + dir * 15, hy + 1);
      ctx.lineTo(hx + dir * 18, hy - 2); ctx.moveTo(hx + dir * 15, hy + 1); ctx.lineTo(hx + dir * 18, hy + 4); ctx.stroke();
    }
  } else {
    ctx.strokeStyle = '#111'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(hx + dir * 1, hy - 5); ctx.lineTo(hx + dir * 5, hy - 1);
    ctx.moveTo(hx + dir * 5, hy - 5); ctx.lineTo(hx + dir * 1, hy - 1); ctx.stroke();
  }
  ctx.restore();
}

function drawMonkey() {
  const pose = m.vine ? 'vine' : (m.onGround ? (Math.abs(m.vx) > 25 ? 'run' : 'idle') : 'air');
  const FUR = '#8b5a2b', DARK = '#5e3a1a', LIGHT = '#e8bd86';
  ctx.save();
  ctx.translate(m.x, m.y);
  if (m.inv > 0 && Math.floor(T * 14) % 2 === 0) ctx.globalAlpha = 0.45;
  if (pose === 'vine') ctx.rotate(-m.vine.th * 0.9);
  else if (pose === 'air') ctx.rotate(clamp(m.vx / 1400, -0.5, 0.5) * m.face);
  ctx.scale(m.face, 1);
  const ph = m.anim * (pose === 'run' ? 15 : 3);

  // tail
  const tw = Math.sin(m.anim * (pose === 'run' ? 10 : 4)) * (pose === 'run' ? 6 : 4);
  ctx.strokeStyle = DARK; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-9, 12); ctx.bezierCurveTo(-30, 14 + tw, -38, -6 + tw, -26, -17 + tw); ctx.stroke();

  // far limbs
  let fa, na, ff, nf;
  if (pose === 'vine') {
    fa = [-2, -37]; na = [3, -36];
    ff = [-4 + Math.sin(T * 3) * 2, 30]; nf = [6 + Math.sin(T * 3 + 1) * 2, 31];
  } else if (pose === 'run') {
    const a = Math.sin(ph) * 0.9;
    na = [2 + Math.sin(a) * 15, -6 + Math.cos(a) * 14]; fa = [2 - Math.sin(a) * 15, -6 + Math.cos(a) * 14];
    nf = [4 + Math.sin(ph) * 13, 26 - Math.max(0, Math.cos(ph)) * 7];
    ff = [-2 - Math.sin(ph) * 13, 26 - Math.max(0, -Math.cos(ph)) * 7];
  } else if (pose === 'air') {
    na = [16, -26]; fa = [4, -31]; nf = [11, 22]; ff = [-3, 25];
  } else {
    const b = Math.sin(m.anim * 3) * 1.2;
    na = [9, 7 + b]; fa = [-4, 7 + b]; nf = [8, 26]; ff = [-3, 26];
  }
  if (m.slap > 0) na = [32, -14];
  limb(-2, 14, ff[0], ff[1], 6, DARK);
  limb(0, -8, fa[0], fa[1], 5, DARK);

  // body
  ctx.fillStyle = FUR; ctx.beginPath(); ctx.ellipse(0, 2, 13, 17, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = LIGHT; ctx.beginPath(); ctx.ellipse(3, 5, 8, 11, 0, 0, TAU); ctx.fill();

  // near limbs
  limb(4, 14, nf[0], nf[1], 6.5, FUR);
  ctx.fillStyle = FUR; ctx.beginPath(); ctx.arc(nf[0], nf[1], 4.2, 0, TAU); ctx.fill();
  limb(2, -8, na[0], na[1], 5.5, FUR);
  ctx.fillStyle = LIGHT; ctx.beginPath(); ctx.arc(na[0], na[1], 4, 0, TAU); ctx.fill();
  if (pose === 'vine') { ctx.beginPath(); ctx.arc(fa[0], fa[1], 3.6, 0, TAU); ctx.fill(); }

  // head
  ctx.fillStyle = FUR; ctx.beginPath(); ctx.arc(-7, -22, 6.5, 0, TAU); ctx.fill();
  ctx.fillStyle = LIGHT; ctx.beginPath(); ctx.arc(-7, -22, 3.4, 0, TAU); ctx.fill();
  ctx.fillStyle = FUR; ctx.beginPath(); ctx.arc(4, -20, 13, 0, TAU); ctx.fill();
  ctx.fillStyle = LIGHT; ctx.beginPath(); ctx.ellipse(8, -17, 9.5, 8.5, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(5, -22, 3, 0, TAU); ctx.arc(12, -22, 3, 0, TAU); ctx.fill();
  ctx.fillStyle = '#1a0f05';
  ctx.beginPath(); ctx.arc(6, -22, 1.7, 0, TAU); ctx.arc(13, -22, 1.7, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(13, -17, 1.1, 0, TAU); ctx.arc(10, -17, 1.1, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#4a2a10'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(10, -14, 4, 0.2, Math.PI - 0.4); ctx.stroke();

  // slap swoosh
  if (m.slap > 0) {
    const k = 1 - m.slap / 0.2;
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.85 * (1 - k)) + ')';
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(0, -6, 50 + k * 45, -0.9, 0.9); ctx.stroke();
  }
  ctx.restore();
}

function drawParticles() {
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const p of pops) {
    ctx.globalAlpha = clamp(p.life / 0.5, 0, 1);
    txt(p.text, p.x, p.y, 22, p.color, 'center');
  }
  ctx.globalAlpha = 1;
}

function drawWorld() {
  ctx.save();
  ctx.translate(-Math.floor(camX), 0);
  const x0 = camX - 120, x1 = camX + W + 120;
  drawCanopy(false);
  drawSign(330);
  for (const tr of trees) if (tr.x > x0 && tr.x < x1) drawTreeBack(tr);
  for (const c of coconuts) if (c.state === 0 && c.x > x0 && c.x < x1) drawCoconut(c);
  for (const tr of trees) if (tr.x > x0 && tr.x < x1) drawTreeFront(tr);
  drawWater();
  drawGround();
  for (const sn of snakes) if (sn.x > x0 && sn.x < x1) drawSnake(sn);
  for (const b of nanas) if (!b.got && b.x > x0 && b.x < x1) drawBanana(b.x, b.y, b.gold);
  for (const v of vines) if (v.ax > x0 - 340 && v.ax < x1 + 340) drawVine(v);
  for (const c of coconuts) if (c.state === 1 && c.x > x0 && c.x < x1) drawCoconut(c);
  if (m) drawMonkey();
  drawParticles();
  drawCanopy(true);
  ctx.restore();
}

// ---------------------------------------------------------------
// HUD and overlays
// ---------------------------------------------------------------
function drawHUD() {
  const slots = Math.max(3, m.hearts);
  for (let i = 0; i < slots; i++) drawHeart(30 + i * 34, 34, 30, i < m.hearts);
  drawBanana(26, 78, false);
  txt('x ' + nanaCount, 48, 86, 22, '#ffe14a');
  txt(String(totalScore()), W / 2, 44, 38, '#ffffff', 'center');
  txt('SCORE', W / 2, 62, 13, '#ffe9a8', 'center');
  txt('BEST ' + best, W - 20, 34, 18, '#ffe9a8', 'right');
  if (muted) txt('SOUND OFF (M)', W - 20, 56, 13, '#ffffff', 'right');
  if (combo > 1 && comboT > 0) {
    txt('COMBO x' + combo, W / 2, 94, 24, '#ffb43a', 'center');
    ctx.fillStyle = 'rgba(0,0,0,.4)'; rr(W / 2 - 60, 102, 120, 7, 3); ctx.fill();
    ctx.fillStyle = '#ffb43a'; rr(W / 2 - 60, 102, 120 * clamp(comboT / 1.6, 0, 1), 7, 3); ctx.fill();
  }
  if (banner.t > 0) {
    ctx.globalAlpha = clamp(banner.t / 0.6, 0, 1);
    txt(banner.text, W / 2, 150, 26, banner.color, 'center');
    ctx.globalAlpha = 1;
  }
  if (mode === 'playing' && playT < 16) {
    ctx.globalAlpha = clamp((16 - playT) / 2, 0, 1) * 0.92;
    ctx.fillStyle = 'rgba(10,30,18,.7)'; rr(W / 2 - 330, H - 74, 660, 56, 10); ctx.fill();
    txt('Jump with SPACE. In the air, HOLD SPACE near a vine to grab it, RELEASE to launch.', W / 2, H - 50, 16, '#fff', 'center', 'rgba(0,0,0,0)');
    txt('Left/Right pumps the swing. Up/Down climbs. X slaps coconuts down onto snakes.', W / 2, H - 28, 16, '#ffe9a8', 'center', 'rgba(0,0,0,0)');
    ctx.globalAlpha = 1;
  }
}

function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(8,30,18,.72)'; rr(x, y, w, h, 16); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,225,74,.55)'; rr(x, y, w, h, 16); ctx.stroke();
}

function drawTitle() {
  ctx.fillStyle = 'rgba(6,24,14,.5)'; ctx.fillRect(0, 0, W, H);
  txt('MONKEY', W / 2, 138, 84, '#ffe14a', 'center', '#4a2a0a');
  txt('BONANZA', W / 2, 220, 84, '#ff9f2e', 'center', '#4a2a0a');
  drawBanana(W / 2 - 330, 110, true); drawBanana(W / 2 + 330, 110, true);
  drawBanana(W / 2 - 300, 200, false); drawBanana(W / 2 + 300, 200, false);
  panel(W / 2 - 340, 250, 680, 170);
  txt('SPACE or TAP: jump. In the air, HOLD to grab a vine, RELEASE to launch.', W / 2, 286, 18, '#ffffff', 'center', 'rgba(0,0,0,0)');
  txt('LEFT / RIGHT: move and pump the swing.   UP / DOWN: climb the vine.', W / 2, 314, 18, '#ffffff', 'center', 'rgba(0,0,0,0)');
  txt('X: slap coconuts out of the palms. Drop them on snakes for 250 points.', W / 2, 342, 18, '#ffe9a8', 'center', 'rgba(0,0,0,0)');
  txt('Chain bananas in the air for a combo. Every 20 bananas earns a heart.', W / 2, 370, 18, '#ffe9a8', 'center', 'rgba(0,0,0,0)');
  txt('P: pause    M: sound', W / 2, 400, 15, '#bfe6c8', 'center', 'rgba(0,0,0,0)');
  const pulse = 0.65 + 0.35 * Math.sin(T * 4);
  ctx.globalAlpha = pulse;
  txt('Press SPACE or tap to start', W / 2, 468, 30, '#ffffff', 'center');
  ctx.globalAlpha = 1;
  if (best > 0) txt('BEST ' + best, W / 2, 500, 18, '#ffe9a8', 'center');
}

function drawPaused() {
  ctx.fillStyle = 'rgba(6,24,14,.6)'; ctx.fillRect(0, 0, W, H);
  txt('PAUSED', W / 2, H / 2 - 6, 70, '#ffffff', 'center');
  txt('Press P or tap to resume', W / 2, H / 2 + 40, 22, '#ffe9a8', 'center');
}

function drawOver() {
  ctx.fillStyle = 'rgba(6,24,14,.62)'; ctx.fillRect(0, 0, W, H);
  panel(W / 2 - 280, 110, 560, 300);
  txt('GAME OVER', W / 2, 190, 62, '#ff6b5a', 'center', '#3a0a05');
  txt('Score  ' + totalScore(), W / 2, 244, 36, '#ffffff', 'center');
  txt('Bananas ' + nanaCount + '    Snakes bonked ' + kills + '    Coconuts ' + knocked, W / 2, 282, 18, '#ffe9a8', 'center', 'rgba(0,0,0,0)');
  if (newBest) txt('NEW BEST!', W / 2, 322, 28, '#ffe14a', 'center');
  else txt('Best  ' + best, W / 2, 322, 24, '#ffe9a8', 'center');
  if (overT > 0.7) {
    ctx.globalAlpha = 0.65 + 0.35 * Math.sin(T * 4);
    txt('Press SPACE or tap to swing again', W / 2, 382, 24, '#ffffff', 'center');
    ctx.globalAlpha = 1;
  }
}

function draw() {
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  drawBackground();
  drawWorld();
  if (mode === 'title') { drawTitle(); return; }
  if (m) drawHUD();
  if (mode === 'paused') drawPaused();
  if (mode === 'over') drawOver();
}

// ---------------------------------------------------------------
// Input
// ---------------------------------------------------------------
function onActionPress() {
  if (mode === 'title' || mode === 'over') { startGame(); return; }
  if (mode === 'playing') inp.jumpPress = true;
}

function setInput(name, down) {
  if (name === 'grab') {
    if (down && !inp.grab) onActionPress();
    if (down && mode === 'paused') { mode = 'playing'; }
    inp.grab = down;
    return;
  }
  if (name === 'up') {
    if (down && !inp.up && mode === 'playing') inp.jumpPress = true;
    inp.up = down;
    return;
  }
  if (name === 'slap') { if (down && mode === 'playing') inp.slapPress = true; return; }
  inp[name] = down;
}

function togglePause() {
  if (mode === 'playing') mode = 'paused';
  else if (mode === 'paused') mode = 'playing';
}

const KEYS = {
  ' ': 'grab', 'ArrowUp': 'up', 'w': 'up', 'W': 'up', 'ArrowDown': 'down', 's': 'down', 'S': 'down',
  'ArrowLeft': 'left', 'a': 'left', 'A': 'left', 'ArrowRight': 'right', 'd': 'right', 'D': 'right',
  'x': 'slap', 'X': 'slap', 'z': 'slap', 'Z': 'slap', 'e': 'slap', 'E': 'slap', 'Shift': 'slap'
};

window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === ' ' || k.indexOf('Arrow') === 0) e.preventDefault();
  ensureAudio();
  if (e.repeat) return;
  if (k === 'p' || k === 'P' || k === 'Escape') { togglePause(); return; }
  if (k === 'm' || k === 'M') { muted = !muted; return; }
  if (k === 'Enter' && (mode === 'title' || mode === 'over')) { startGame(); return; }
  if (mode === 'paused' && k === ' ') { mode = 'playing'; inp.grab = true; return; }
  const name = KEYS[k];
  if (name) setInput(name, true);
});

window.addEventListener('keyup', e => {
  const name = KEYS[e.key];
  if (name && name !== 'slap') setInput(name, false);
});

function clearInputs() {
  inp.left = inp.right = inp.up = inp.down = inp.grab = false;
  inp.jumpPress = inp.slapPress = false;
}
window.addEventListener('blur', clearInputs);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { clearInputs(); if (mode === 'playing') mode = 'paused'; }
});

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  ensureAudio();
  if (mode === 'paused') { mode = 'playing'; return; }
  setInput('grab', true);
});
const pointerUp = () => setInput('grab', false);
canvas.addEventListener('pointerup', pointerUp);
canvas.addEventListener('pointercancel', pointerUp);
canvas.addEventListener('pointerleave', pointerUp);
canvas.addEventListener('contextmenu', e => e.preventDefault());

document.querySelectorAll('.tb').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    ensureAudio();
    try { b.setPointerCapture(e.pointerId); } catch (err) {}
    b.classList.add('on');
    setInput(k, true);
  });
  const up = () => { b.classList.remove('on'); setInput(k, false); };
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up);
  b.addEventListener('lostpointercapture', up);
  b.addEventListener('contextmenu', e => e.preventDefault());
});

// ---------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------
let last = 0;
function frame(ts) {
  const dt = clamp(((ts - last) / 1000) || 0.016, 0.001, 0.033);
  last = ts;
  if (mode === 'playing') update(dt);
  else if (mode !== 'paused') ambient(dt);
  draw();
  requestAnimationFrame(frame);
}

newGame();
window.__monkeyBonanza = () => ({ mode, score: totalScore(), hearts: m.hearts, x: m.x, y: m.y, camX, vine: !!m.vine,
  onGround: m.onGround, nanas: nanaCount, kills, knocked, vines: vines.length, snakes: snakes.length });
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
